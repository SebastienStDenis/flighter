services:
  app:
    # Published by .github/workflows/release.yml on every push to main. `build` stays so
    # a checkout can still compile its own, but the home stack pulls: `docker compose
    # pull` fetches the built image rather than making the desktop compile it.
    image: ghcr.io/sebastienstdenis/flighter:latest
    build: .
    container_name: flighter
    restart: unless-stopped
    env_file: .env
    ports:
      # Published on the host so the host can serve it. Everything reaches the app
      # through the machine's own address.
      - "8000:8000"
    volumes:
      # The whole of the deployment's state: the SQLite database and the credentials the
      # app mints for itself. Back this up; nothing else here is worth keeping.
      #
      # Swap in `./data:/app/data` to keep it in the checkout instead. The container runs
      # as uid 10001, so that directory has to be owned by it: chown 10001:10001 data.
      - data:/app/data

volumes:
  data:
