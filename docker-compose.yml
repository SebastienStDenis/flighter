services:
  app:
    # Published by .github/workflows/release.yml on every push to main. `build` stays so
    # a checkout can still compile its own, but the home stack pulls: `docker compose
    # pull` fetches the built image rather than making the desktop compile it.
    image: ghcr.io/sebastienstdenis/flighter:latest
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://flights:${POSTGRES_PASSWORD}@db:5432/flights
    depends_on:
      db:
        condition: service_healthy
      tailscale:
        condition: service_started
    volumes:
      # Holds the credentials the app mints for itself: today just the widget token.
      # Losing it means re-entering that token on the phone, so it is a volume rather
      # than a temp directory.
      - app-data:/app/data
    # No ports. The app answers on the tailnet address the sidecar owns, which is the
    # whole point: nothing is published to the internet and the home router keeps every
    # inbound port shut.
    network_mode: service:tailscale

  tailscale:
    image: tailscale/tailscale:latest
    restart: unless-stopped
    hostname: flighter
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      # Serves the app over HTTPS on the tailnet with a real certificate, which iOS
      # prefers and the widget needs to fetch without complaint.
      TS_SERVE_CONFIG: /config/serve.json
      TS_EXTRA_ARGS: --accept-dns=false
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./scripts/serve.json:/config/serve.json:ro
    devices:
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: flights
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: flights
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
      - backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flights -d flights"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  app-data:
  db-data:
  backups:
  tailscale-state:
