services:
  app:
    # Published by .github/workflows/release.yml on every push to main. `build` stays so
    # a checkout can still compile its own, but the home stack pulls: `docker compose
    # pull` fetches the built image rather than making the desktop compile it.
    image: ghcr.io/sebastienstdenis/flighter:latest
    build: .
    container_name: flighter
    restart: unless-stopped
    env_file:
      # Absent on a fresh clone, and nothing here needs it: every credential is entered
      # on the settings page and stored in the volume. A file here only ever seeds one
      # before the first boot.
      - path: .env
        required: false
    ports:
      # Published on the host so the host can serve it. Everything reaches the app
      # through the machine's own address.
      - "8000:8000"
    volumes:
      # The whole of the deployment's state: the SQLite database and every credential.
      # Back this up; nothing else here is worth keeping, and a copy of it is a copy of
      # the credentials.
      #
      # Swap in `./data:/app/data` to keep it in the checkout instead. The container runs
      # as uid 10001, so that directory has to be owned by it: chown 10001:10001 data.
      - data:/app/data

  # The Update button on the settings page asks Watchtower to pull a newer image and
  # recreate the app - the app cannot replace its own container from inside it, so
  # Watchtower holds the socket and the app only ever holds a token. Uncomment this (or
  # fold the two environment lines into a Watchtower you already run), then enter
  # http://watchtower:8080 and the token under Settings → Connections. See
  # docs/updates.md.
  #
  # watchtower:
  #   # The maintained fork; the archived containrrr/watchtower speaks the same API
  #   # and works too.
  #   image: nickfedor/watchtower
  #   container_name: watchtower
  #   restart: unless-stopped
  #   environment:
  #     # The fork's spelling is WATCHTOWER_HTTP_API_ENDPOINTS=update; this older one
  #     # is what both it and the original understand.
  #     - WATCHTOWER_HTTP_API_UPDATE=true
  #     - WATCHTOWER_HTTP_API_TOKEN=choose-a-long-random-string
  #     # Keeps the scheduled sweep running alongside the button; without this line,
  #     # updates only happen when the button asks for one.
  #     - WATCHTOWER_HTTP_API_PERIODIC_POLLS=true
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock

volumes:
  data:
