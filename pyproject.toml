[project]
name = "flighter"
version = "0.1.0"
description = "Self-hosted flight tracking: iCloud bookings in, AeroAPI status, Google Calendar and a phone widget out."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aioimaplib>=2.0.1",
    "aiosqlite>=0.20",
    "airportsdata>=20250909",
    "alembic>=1.16",
    "anthropic>=0.120.0",
    "asyncpg>=0.30",
    "beautifulsoup4>=4.13",
    "fastapi>=0.118",
    "google-api-python-client>=2.190",
    "google-auth-oauthlib>=1.2",
    "httpx>=0.28",
    "jinja2>=3.1",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "python-multipart>=0.0.20",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn[standard]>=0.34",
]

[project.scripts]
flighter = "flighter.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flighter"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

# The Google and IMAP client libraries ship no type information, so calls into them are
# untyped.
[[tool.mypy.overrides]]
module = ["flighter.gcal", "flighter.google_auth", "flighter.mail"]
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = [
    "aioimaplib.*",
    "googleapiclient.*",
    "google_auth_oauthlib.*",
    "google.*",
    "airportsdata.*",
    "bs4.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
