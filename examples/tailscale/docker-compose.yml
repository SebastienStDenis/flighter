# Flighter behind a Tailscale sidecar, reachable at https://flighter.<your-tailnet>.ts.net
# and nowhere else. See README.md in this directory before running it.

services:
  # Joins the tailnet as its own device rather than sharing the host's, so the app gets a
  # name and a certificate of its own and the host keeps whatever it already serves on
  # 443. `tailscale serve` terminates TLS here and proxies to the app over loopback.
  tailscale:
    image: tailscale/tailscale:latest
    hostname: flighter
    restart: unless-stopped
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      # No NET_ADMIN and no /dev/net/tun: userspace networking is enough to accept the
      # one proxied connection, and it keeps the container unprivileged.
      - TS_USERSPACE=true
    volumes:
      # Holds the node key. Keep it and the device stays authenticated; lose it and the
      # stack needs a fresh auth key to register again.
      - tailscale:/var/lib/tailscale
      - ./tailscale-serve.json:/config/serve.json:ro

  flighter:
    image: ghcr.io/sebastienstdenis/flighter:latest
    restart: unless-stopped
    # Shares the sidecar's network namespace, which is what lets `tailscale serve` reach
    # the app on 127.0.0.1:8000. Nothing is published to the host, so the tailnet is the
    # only way in - the app has no login of its own and relies on that.
    network_mode: service:tailscale
    depends_on:
      - tailscale
    volumes:
      # The SQLite database and every credential. This is the whole of the deployment's
      # state, and a copy of it is a copy of the credentials.
      - data:/app/data
    labels:
      # Scopes updates to this container: the sidecar is left alone. The Update button on
      # the settings page needs both of these.
      - com.centurylinklabs.watchtower.enable=true
      - com.centurylinklabs.watchtower.scope=flighter

  # Backs the Update button under Settings → Preferences → Advanced, and sweeps hourly on
  # its own. Drop this service if you would rather update by hand. See docs/updates.md.
  watchtower:
    image: nickfedor/watchtower:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 3600 --cleanup --scope flighter
    environment:
      - WATCHTOWER_HTTP_API_UPDATE=true
      - WATCHTOWER_HTTP_API_TOKEN=${WATCHTOWER_HTTP_API_TOKEN}
      - WATCHTOWER_HTTP_API_PERIODIC_POLLS=true
    labels:
      - com.centurylinklabs.watchtower.scope=flighter

volumes:
  data:
  tailscale:
