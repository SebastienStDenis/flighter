<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block title %}Flights{% endblock %}</title>
<meta name="theme-color" content="#0a0c11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Flights">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/static/manifest.json">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="stylesheet" href="/static/app.css">
<script src="/static/htmx.min.js" defer></script>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M21 15.5 13.5 11V4.2a1.5 1.5 0 0 0-3 0V11L3 15.5v2l7.5-2.2v4.4L8 21.3V23l4-1.2 4 1.2v-1.7l-2.5-1.6v-4.4l7.5 2.2z"/>
      </svg>
      Flights
    </a>
    <nav>
      <a href="/"{% if page == 'flights' %} aria-current="page"{% endif %}>List</a>
      <a href="/review"{% if page == 'review' %} aria-current="page"{% endif %}>Review</a>
      <a href="/passengers"{% if page == 'passengers' %} aria-current="page"{% endif %}>People</a>
      <a href="/health"{% if page == 'health' %} aria-current="page"{% endif %}>Health</a>
    </nav>
  </div>
</header>
<main>
{% block content %}{% endblock %}
</main>
<script>
  // The shell is cached so the app opens from the home screen with no network. Flight
  // data is never cached; see sw.js.
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/static/sw.js", { scope: "/" });
  }
</script>
</body>
</html>
