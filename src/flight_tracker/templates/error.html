{% extends "base.html" %}
{% block title %}{{ code }}{% endblock %}
{% block content %}
<div class="empty">
  <strong>{{ detail }}</strong>
  {% if code == 404 %}Whatever was here has been removed, or the link is wrong.{% endif %}
  <div class="actions" style="justify-content: center">
    <a class="btn btn--primary" href="/">Back to the list</a>
  </div>
</div>
{% endblock %}
