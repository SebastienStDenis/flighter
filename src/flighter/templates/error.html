{% extends "base.html" %}
{% block title %}{{ code }}{% endblock %}
{% block content %}
<section class="empty mt-8">
  <header>
    <figure>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 8v4M12 16h.01"/><circle cx="12" cy="12" r="10"/>
      </svg>
    </figure>
    <h2>{{ detail }}</h2>
    <p>{% if code == 404 %}This page has moved or the link is wrong.
       {%- else %}Something went wrong on our end.{% endif %}</p>
  </header>
  <footer><a class="btn" href="/">Back to flights</a></footer>
</section>
{% endblock %}
