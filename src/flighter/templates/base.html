<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block title %}Flights{% endblock %}</title>
<meta name="theme-color" content="#f5f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0c11" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Flights">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/static/manifest.json">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="preload" href="/static/fonts/manrope-latin-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/static/fonts/jetbrains-mono-latin-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/flighter.css">
<script src="/static/htmx.min.js" defer></script>
<script src="/static/basecoat-tabs.min.js" defer></script>
</head>
<body class="flex min-h-dvh flex-col">
{% set here = request.url.path %}
{% set review = review_count|default(0) %}
<header class="sticky top-0 z-20 border-b bg-background/85 backdrop-blur"
        style="padding-top: env(safe-area-inset-top)">
  <nav class="mx-auto flex h-14 max-w-lg items-center gap-1 px-3" aria-label="Sections">
    <a class="btn" data-size="sm" href="/"
       data-variant="{{ 'secondary' if here == '/' or here.startswith('/f') else 'ghost' }}"
       {% if here == '/' or here.startswith('/f') %}aria-current="page"{% endif %}>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M2 22h20M6.36 17.4 4 17l-2-4 1.1-.55a2 2 0 0 1 1.8 0l.17.1a2 2 0 0 0 1.8 0L8 12 5 6l.9-.45a2 2 0 0 1 2.09.2l4.02 3a2 2 0 0 0 2.1.2l4.19-2.06a2.41 2.41 0 0 1 1.73-.17L21 7a1.4 1.4 0 0 1 .87 1.99l-.38.76c-.23.46-.6.84-1.07 1.08L7.58 17.2a2 2 0 0 1-1.22.18Z"/>
      </svg>
      Flights
    </a>
    {% if review %}
    <a class="btn" data-size="sm" href="/review"
       data-variant="{{ 'secondary' if here.startswith('/review') else 'ghost' }}"
       {% if here.startswith('/review') %}aria-current="page"{% endif %}>
      Review
      <span class="badge" data-variant="warn">{{ review }}</span>
    </a>
    {% endif %}
    <a class="btn ml-auto" data-size="sm" href="/settings"
       data-variant="{{ 'secondary' if here.startswith('/settings') else 'ghost' }}"
       {% if here.startswith('/settings') %}aria-current="page"{% endif %}>Settings</a>
  </nav>
</header>
<main class="mx-auto flex w-full max-w-lg flex-1 flex-col px-4 pt-4">
{% block content %}{% endblock %}
</main>
<script>
  // Countdowns tick from the target already in the page and fetch nothing, which is what
  // keeps them consistent with the rest: the server rendered a correct string for the
  // no-JS case, and this replaces it in place.
  (function () {
    function figure(ms) {
      var total = Math.floor(Math.abs(ms) / 1000);
      var days = Math.floor(total / 86400);
      var hours = Math.floor(total / 3600) % 24;
      var minutes = Math.floor(total / 60) % 60;
      var seconds = total % 60;
      function pad(n) { return n < 10 ? "0" + n : String(n); }
      if (days) return days + "d " + hours + "h";
      if (hours) return hours + "h " + pad(minutes) + "m";
      return minutes + "m " + pad(seconds) + "s";
    }
    function tick() {
      var now = Date.now();
      document.querySelectorAll("time.countdown[data-to]").forEach(function (el) {
        var target = Date.parse(el.dataset.to);
        if (isNaN(target)) return;
        // A target in the past counts up: "20m ago" is a fact, "-20m" is arithmetic.
        el.textContent = figure(target - now) + (target < now ? " ago" : "");
      });
    }
    tick();
    setInterval(tick, 1000);
  })();

  // The shell is cached so the app opens from the home screen with no network. Flight
  // data is never cached; see sw.js.
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/sw.js");
  }
</script>
</body>
</html>
