name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - run: uv sync --frozen --all-groups

      - name: ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: mypy
        run: uv run mypy

      - name: pytest
        run: uv run pytest -q

  migrations:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite+aiosqlite:///ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --frozen --all-groups
      # A migration that only ever runs forwards is a migration nobody can back out of.
      - name: upgrade, downgrade, upgrade
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: flighter:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The image boots with an empty volume and no credentials, so a container that
      # cannot come up on its own is caught here rather than by the home server.
      - name: boot and probe /healthz
        run: |
          docker run -d --name flighter-ci -p 8000:8000 flighter:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz; then exit 0; fi
            sleep 2
          done
          docker logs flighter-ci
          exit 1
